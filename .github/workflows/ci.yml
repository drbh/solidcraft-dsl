name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: notice when a new SolidCraft release changes what the compiler predicts.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  # Against the SolidCraft release pinned in flake.nix: the one the compiler was measured on.
  pinned:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix develop --command cargo fmt --check
      - run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: nix develop --command cargo test --workspace --locked
      - run: nix build

  # Against the newest SolidCraft release: fails when the engine drifted from what the
  # compiler predicts, without blocking the pinned job.
  latest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the latest solidcraft-cli
        run: ci/install-solidcraft-cli.sh latest "$RUNNER_TEMP/solidcraft"
      - run: cargo test --workspace --locked
        env:
          SOLIDCRAFT_CLI: ${{ runner.temp }}/solidcraft/solidcraft-cli

  # All features, including the two assembly APIs not yet in the stock release.
  # Keep the upstream revision and the small, reviewed patch reproducible.
  full-engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tangency-labs/solidcraft
          ref: 3d3dd27439995f37eaed1feaa1c53a0e42d2fe39
          path: build/engine
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            build/engine -> target
      - name: Build the current engine with DSL assembly APIs
        working-directory: build/engine
        run: |
          git apply ../../ci/solidcraft-assembly.patch
          cargo build --locked -p solidcraft-cli --bin solidcraft-cli
          cargo test --locked -p solidcraft-engine --lib cmd::component::properties::tests
          cargo test --locked -p solidcraft-engine authored_occurrence_names
      - name: Verify every DSL capability and run the complete suite
        run: ci/check-compatibility.sh
        env:
          SOLIDCRAFT_CLI: ${{ github.workspace }}/build/engine/target/debug/solidcraft-cli
      - name: Build every example and print recipe
        run: ci/check-examples.sh
        env:
          SOLIDCRAFT_CLI: ${{ github.workspace }}/build/engine/target/debug/solidcraft-cli
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compatibility-reports-${{ matrix.os }}
          path: build/example-compatibility
