name: Site

# Builds the examples gallery and the playground and deploys them to Cloudflare Pages
# (solidcraft-dsl.dholtz.com). Needs the repository secrets CLOUDFLARE_API_TOKEN (a token with
# Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
#
# Nothing that is already published is built again: the deployed site's build-index.json maps
# each example's inputs (the hash of the command script it compiles to, plus its files) to its
# model, thumbnail and playground timing, and the engine's inputs to the engine. `--reuse`
# downloads those and only evaluates examples whose inputs changed, and only rebuilds the
# engine when its inputs changed. A run with nothing to rebuild takes well under a minute.

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "site/**"
      - "src/**"
      - "crates/**"
      - "ci/examples-site.py"
      - "ci/examples-glb.py"
      - "ci/playground-engine.py"
      - "Cargo.lock"
      - "flake.nix"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            build/solidcraft-src -> target
          cache-directories: build/solidcraft-src/target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the pinned solidcraft-cli
        run: |
          version=$(sed -n 's/.*version = "\([0-9.]*\)".*/\1/p' flake.nix | head -1)
          cli=$(ci/install-solidcraft-cli.sh "$version" "$RUNNER_TEMP/solidcraft" | tail -1)
          echo "SOLIDCRAFT_CLI=$cli" >> "$GITHUB_ENV"

      - name: Build the compiler
        run: cargo build --locked

      - name: Build the gallery and the playground
        run: >
          python3 ci/examples-site.py --playground --site build/site -j 4
          --bin target/debug/solidcraft-dsl --reuse https://solidcraft-dsl.dholtz.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/site --project-name=solidcraft-dsl --branch=main
