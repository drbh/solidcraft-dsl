[package]
name = "solidcraft-dsl"
description = "Compiles declarative .sc design files into SolidCraft command scripts (solidcraft-cli run, MCP batch)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/drbh/solidcraft-dsl"
rust-version = "1.85"

[workspace]
members = ["crates/solidcraft-expr"]

[dependencies]
base64 = "0.22"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
solidcraft-expr = { path = "crates/solidcraft-expr", version = "0.1.0" }
font8x8 = "0.3"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
lexopt = "0.3"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value", "unbounded_depth"] }
sha2 = "0.10"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
